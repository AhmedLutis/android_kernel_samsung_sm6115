name: Build SM6115 Kernel (Clang + KSU + SusFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: AhmedLutis/android_kernel_samsung_sm6115
          ref: master
          path: kernel

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential flex \
            libssl-dev libelf-dev \
            zip unzip curl git \
            python3

      - name: Install Clang 17
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          sudo apt install -y clang-17 lld-17

      - name: Add KernelSU-Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash -s dev
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/bengal_defconfig
          echo "CONFIG_KSU_NEXT=y" >> arch/arm64/configs/vendor/bengal_defconfig

      - name: Add SusFS
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 susfs
          cd kernel
          cp -r ../susfs/kernel_patches/fs/* fs/
          cp -r ../susfs/kernel_patches/include/linux/* include/linux/
          patch -p1 < ../susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/vendor/bengal_defconfig

      - name: Build Kernel (Clang)
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=/usr/lib/llvm-17/bin:$PATH

          make O=out vendor/bengal_defconfig
          make -j$(nproc) O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1

      - name: Package AnyKernel3
        run: |
          cd kernel
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          cp out/arch/arm64/boot/Image.gz AK3/
          cd AK3
          zip -r9 ../SM6115-KSU-SUSFS.zip *

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: SM6115-KSU-SUSFS
          path: kernel/SM6115-KSU-SUSFS.zip
