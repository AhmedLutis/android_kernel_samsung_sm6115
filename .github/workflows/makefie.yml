name: Makefile CI
name: Build Samsung SM6115 Kernel with KSU NEXT & SusFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: AhmedLutis/android_kernel_samsung_sm6115
          ref: master
          path: kernel

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev \
            git zip unzip curl python3 python2 gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu

      - name: Setup Toolchain (GCC)
        run: |
          mkdir -p toolchain
          cd toolchain
          # Using Proton-Clang or a specific GCC toolchain is often better, 
          # but here we use the requested GCC. We will fetch a prebuilt one.
          wget https://github.com/mvaisakh/gcc-arm64/archive/refs/heads/master.zip -O gcc64.zip
          unzip gcc64.zip && mv gcc-arm64-master gcc64
          wget https://github.com/mvaisakh/gcc-arm/archive/refs/heads/master.zip -O gcc32.zip
          unzip gcc32.zip && mv gcc-arm-master gcc32
          echo "$(pwd)/gcc64/bin" >> $GITHUB_PATH
          echo "$(pwd)/gcc32/bin" >> $GITHUB_PATH

      - name: Integrate KernelSU-Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/dev/kernel/setup.sh" | bash -s dev
          # Enable KSU in defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/bengal_defconfig
          echo "CONFIG_KSU_NEXT=y" >> arch/arm64/configs/vendor/bengal_defconfig

      - name: Integrate SusFS
        run: |
          # Clone SusFS repo
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 susfs
          
          cd kernel
          # Copy SusFS files
          cp ../susfs/kernel_patches/fs/* fs/
          cp ../susfs/kernel_patches/include/linux/* include/linux/
          
          # Apply SusFS patches
          # 1. Patch KernelSU-Next
          cp ../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cd KernelSU && patch -p1 < 10_enable_susfs_for_ksu.patch || echo "KSU SusFS patch failed (might be already applied)"
          cd ..
          
          # 2. Patch Kernel
          cp ../susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch .
          patch -p1 < 50_add_susfs_in_kernel-4.19.patch || echo "Kernel SusFS patch failed (manual check required)"
          
          # Enable SusFS in defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/vendor/bengal_defconfig

      - name: Build Kernel
        run: |
          cd kernel
          export KBUILD_OUTPUT=$(pwd)/out
          export ARCH=arm64
          export CROSS_COMPILE=$(pwd)/toolchain/gcc64/bin/aarch64-elf-
          export CROSS_COMPILE_ARM32=$(pwd)/toolchain/gcc32/bin/arm-eabi-
          
          make O=$KBUILD_OUTPUT ARCH=$ARCH vendor/bengal_defconfig
          make O=$KBUILD_OUTPUT ARCH=$ARCH \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            -j$(nproc --all)

      - name: Prepare Artifacts
        run: |
          cd kernel
          mkdir -p out
          cp arch/arm64/boot/Image.gz out/
          cp arch/arm64/boot/dtbo.img out/ || true
          # You might want to package this into AnyKernel3
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          cp out/Image.gz AK3/
          cd AK3
          zip -r9 ../kernel-sm6115-ksun-susfs.zip *
      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-sm6115-ksun-susfs
          path: kernel/kernel-sm6115-ksun-susfs.zip
          if-no-files-found: error

on:
  push:
    branches: [ "lineage-23.2" ]
  pull_request:
    branches: [ "lineage-23.2" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: configure
      run: ./configure

    - name: Install dependencies
      run: make

    - name: Run check
      run: make check

    - name: Run distcheck
      run: make distcheck
